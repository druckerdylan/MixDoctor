<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Mix Diagnostic — Mix Analysis</title>
    <meta
      name="description"
      content="Upload a mix. Get a measured, timestamped diagnosis across 14 dimensions — loudness, phase, mud, harshness, kick/808, vocal balance — and an exact fix list you can run in your DAW tonight."
    />

    <!-- Paint the void immediately so there is no white flash before React mounts. -->
    <meta name="theme-color" content="#06060A" />
    <meta name="color-scheme" content="dark" />

    <!-- Level-meter glyph: three bars rising in signal mint. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306060A'/%3E%3Cg fill='%2352F2C4'%3E%3Crect x='7' y='18' width='4' height='8' rx='2'/%3E%3Crect x='14' y='9' width='4' height='17' rx='2'/%3E%3Crect x='21' y='14' width='4' height='12' rx='2'/%3E%3C/g%3E%3C/svg%3E"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mix Diagnostic — Mix Analysis" />
    <meta
      property="og:description"
      content="A measured diagnosis of your mix across 14 dimensions, with the exact moves to fix it."
    />

    <style>
      /* Runs before the bundle loads. Keeps the first frame black instead of
         white, which is the difference between "cinematic" and "web page". */
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #06060a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; color: #f4f4f7; font-family: system-ui, sans-serif">
        Mix Diagnostic needs JavaScript to decode and visualise audio.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
